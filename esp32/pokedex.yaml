# ESPHome firmware for the Pokédex voice interface.
#
# Button press wakes the board from deep sleep, records ~4s of audio from
# an INMP441 (I2S mic), POSTs it as a 16kHz mono 16-bit PCM WAV to the
# backend's /api/voice/recognize, and on a match shows the sprite on a
# GC9A01 round display, plays the cry, then speaks the name and
# description (all as WAV from the backend, via a MAX98357A I2S amp).
# The normal sprite is then shown for 10s, the shiny sprite for another
# 10s, before returning to deep sleep. See README.md for wiring and setup,
# and CLAUDE.md ("Voice interface") for the backend side of this contract.
#
# Targets a 2025.x-era ESPHome (needs the on_data microphone callback and
# the unified mipi_spi display platform). Targets an ESP32-S3 N16R8
# (16MB flash / 8MB octal PSRAM) — mic recording, buffered WAV responses,
# and the decoded sprite image all share that PSRAM budget. An N8R2
# (2MB quad PSRAM) is tighter but should also work; change flash_size to
# 8MB and psram.mode to quad below if using one. Plain ESP32-C3/C6 boards
# don't work here: they have only one I2S peripheral (this design needs
# separate mic/speaker buses) and no/too little PSRAM.

esphome:
  name: pokedex-voice
  friendly_name: Pokédex Voice
  includes:
    - wav_utils.h

esp32:
  variant: esp32s3
  board: esp32s3devkitc1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

substitutions:
  backend_base_url: !secret pokedex_voice__backend_base_url

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

http_request:
  useragent: pokedex-esp32
  timeout: 15s

json:

# ---- Shared state for the record -> recognize -> display -> play flow ----
globals:
  - id: mic_buffer
    type: std::vector<uint8_t>
  - id: play_buffer
    type: std::vector<uint8_t>
  - id: play_offset
    type: size_t
    initial_value: "0"
  - id: matched_pokemon_id
    type: int
    initial_value: "0"
  - id: status_text
    type: std::string
    initial_value: '"Bereit"'

# ---- Wake button ----
binary_sensor:
  - platform: gpio
    id: wake_button
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true
      # Same pin is the deep_sleep wakeup_pin below.
      allow_other_uses: true
    on_press:
      - script.execute: run_pokedex_flow

deep_sleep:
  id: deep_sleep_ctl
  wakeup_pin:
    number: GPIO1
    # Keeps the internal pull-up on during deep sleep, so the pin doesn't
    # float and wake the board spuriously (button just shorts it to GND).
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  # Safety ceiling in case the flow hangs (e.g. WiFi/backend unreachable);
  # the flow itself calls deep_sleep.enter explicitly once done. Generous
  # enough for recording + recognition + cry/name/description playback +
  # the two fixed 10s sprite/shiny display windows.
  run_duration: 90s

# ---- Audio: separate I2S peripherals for mic (record) and amp (play) ----
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    adc_type: external
    i2s_din_pin: GPIO6
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    on_data:
      - lambda: |-
          id(mic_buffer).insert(id(mic_buffer).end(), x.begin(), x.end());

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_speaker_bus
    dac_type: external
    i2s_dout_pin: GPIO16
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

# ---- Display ----
spi:
  - id: spi_bus
    clk_pin: GPIO12
    mosi_pin: GPIO11

font:
  - file: "gfonts://Roboto"
    id: font_status
    size: 18

display:
  - platform: mipi_spi
    id: gc9a01_display
    model: GC9A01A
    dimensions: 240x240
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO14
    spi_id: spi_bus
    rotation: 0°
    lambda: |-
      it.print(120, 210, id(font_status), TextAlign::CENTER, id(status_text).c_str());

online_image:
  - id: sprite_image
    url: "${backend_base_url}/media/sprites/1.png"
    format: PNG
    type: RGB565
    resize: 200x200

# ---- The record -> recognize -> lookup -> display -> play flow ----
#
# NOTE: id(spk)->play(data, len) and id(spk)->is_running() call into the
# i2s_audio speaker component's C++ API directly from a lambda. Confirm
# these exact method names against the ESPHome version you build against
# (`esphome/components/speaker/speaker.h`) before first flash — if they've
# changed, swap for the current equivalents (e.g. a `speaker.play:` YAML
# action / `speaker.is_playing` condition, if those exist in your version).
# Likewise, http_request.post's binary `body:` lambda is expected but not
# guaranteed binary-safe (see README) — verify on real hardware first.
script:
  - id: run_pokedex_flow
    then:
      - lambda: |-
          id(mic_buffer).clear();
          id(status_text) = "Ich höre zu...";
      - component.update: gc9a01_display
      - microphone.capture: mic
      - delay: 4s
      - microphone.stop_capture: mic
      - lambda: |-
          id(status_text) = "Suche...";
      - component.update: gc9a01_display
      - http_request.post:
          url: "${backend_base_url}/api/voice/recognize"
          request_headers:
            Content-Type: audio/wav
          body: !lambda |-
            return build_wav_body(id(mic_buffer));
          capture_response: true
          on_response:
            - lambda: |-
                id(matched_pokemon_id) = 0;
                json::parse_json(body, [](JsonObject root) -> bool {
                  if (root["matched"] | false) {
                    id(matched_pokemon_id) = root["id"] | 0;
                  }
                  return true;
                });
      - if:
          condition:
            lambda: "return id(matched_pokemon_id) != 0;"
          then:
            - script.execute: show_and_speak_pokemon
          else:
            - lambda: 'id(status_text) = "Nicht erkannt";'
            - component.update: gc9a01_display
            - delay: 2s
      - deep_sleep.enter: deep_sleep_ctl

  - id: show_and_speak_pokemon
    then:
      - lambda: 'id(status_text) = "Gefunden!";'
      - online_image.set_url:
          id: sprite_image
          url: !lambda |-
            return (std::string("${backend_base_url}") + "/media/sprites/"
                    + std::to_string(id(matched_pokemon_id)) + ".png");
      - component.update: gc9a01_display
      - script.execute:
          id: play_remote_wav
          wav_path: "cry.wav"
      - script.wait: play_remote_wav
      - script.execute:
          id: play_remote_wav
          wav_path: "tts/name"
      - script.wait: play_remote_wav
      - script.execute:
          id: play_remote_wav
          wav_path: "tts/description"
      - script.wait: play_remote_wav
      # Show the normal sprite for 10s, then the shiny variant for 10s,
      # then hand back to run_pokedex_flow's deep_sleep.enter.
      - delay: 10s
      - lambda: 'id(status_text) = "Schillernd!";'
      - online_image.set_url:
          id: sprite_image
          url: !lambda |-
            return (std::string("${backend_base_url}") + "/media/shiny/"
                    + std::to_string(id(matched_pokemon_id)) + ".png");
      - component.update: gc9a01_display
      - delay: 10s

  - id: play_remote_wav
    parameters:
      wav_path: string
    then:
      - http_request.get:
          url: !lambda |-
            return (std::string("${backend_base_url}") + "/api/pokemon/"
                    + std::to_string(id(matched_pokemon_id)) + "/" + wav_path);
          capture_response: true
          # Raised from the 1kB default: TTS description WAVs can run a few
          # hundred KB. capture_response buffers the whole body in RAM (PSRAM),
          # http_request has no streaming response callback.
          max_response_buffer_size: 500000
          on_response:
            - lambda: |-
                id(play_buffer) = strip_wav_header(body);
                id(play_offset) = 0;
      # The `interval:` below feeds play_buffer into the speaker; done once
      # it's all been handed over and the speaker has drained and stopped.
      - wait_until:
          lambda: |-
            return id(play_offset) >= id(play_buffer).size()
                && !id(spk)->is_running();
      - lambda: |-
          id(play_buffer).clear();
          id(play_buffer).shrink_to_fit();
          id(play_offset) = 0;

# Feeds the current WAV (play_buffer) into the speaker a chunk at a time.
# speaker->play() only accepts as much as fits its ~500ms ring buffer and
# returns how many bytes it took; looping until it's all written inside one
# lambda would block ESPHome's main loop for the whole clip and trip the
# watchdog, so it's topped up from here instead.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          auto &buf = id(play_buffer);
          size_t &off = id(play_offset);
          if (off < buf.size()) {
            off += id(spk)->play(buf.data() + off, buf.size() - off);
          }
