<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#232a4a" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokédex" />
</head>
<body>
  <header class="topbar">
    <h1>Pokédex</h1>
    <input
      id="search"
      type="search"
      placeholder="Pokémon suchen (Name, deutscher Name oder ID)…"
      autocomplete="off"
    />
  </header>

  <div class="filter-bar">
    <select id="type-filter" class="filter-select" aria-label="Nach Typ filtern">
      <option value="">Alle Typen</option>
    </select>
    <select id="generation-filter" class="filter-select" aria-label="Nach Generation filtern">
      <option value="">Alle Generationen</option>
    </select>
  </div>

  <div id="favorites-section" class="favorites-section" hidden>
    <h2>Favoriten</h2>
    <div id="favorites-row" class="favorites-row"></div>
  </div>

  <div id="recent-section" class="recent-section" hidden>
    <h2>Zuletzt angesehen</h2>
    <div id="recent-row" class="recent-row"></div>
  </div>

  <main>
    <p id="status" class="status"></p>
    <div id="grid" class="grid"></div>
    <button id="load-more" class="load-more" hidden>Mehr laden</button>
  </main>

  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <button id="modal-close" class="modal-close" aria-label="Schließen">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox-overlay" hidden>
    <button id="lightbox-close" class="modal-close" aria-label="Schließen">×</button>
    <button
      id="lightbox-shiny-toggle"
      class="lightbox-shiny-toggle"
      aria-label="Schillernde Variante anzeigen"
      title="Schillernde Variante"
      aria-pressed="false"
      hidden
    >✨</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script src="app.js"></script>
</body>
</html>
