services:
  pokedex:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pokedex-backend
    restart: unless-stopped
    ports:
      - "1510:1510"
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - ./frontend:/app/static
      - ./models:/models:ro
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/pokedex.db
      MEDIA_PATH: /data
      # Self-hosted German STT/TTS for the ESP32 voice interface (esp32/).
      # Fetch these with backend/scripts/download_models.sh; voice endpoints
      # return 503 until the files exist, the rest of the app is unaffected.
      WHISPER_MODEL_PATH: /models/whisper-de
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      PIPER_MODEL_PATH: /models/piper-de.onnx
      PIPER_CONFIG_PATH: /models/piper-de.onnx.json

  importer:
    build: ./importer
    container_name: pokedex-importer
    profiles:
      - import
    volumes:
      - ./data:/data
      - ./backend:/backend
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/pokedex.db

  importer-scheduler:
    build: ./importer
    container_name: pokedex-importer-scheduler
    restart: unless-stopped
    entrypoint: ["/app/loop.sh"]
    profiles:
      - scheduler
    volumes:
      - ./data:/data
      - ./backend:/backend
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/pokedex.db
      # Re-run the importer every IMPORT_INTERVAL_SECONDS (default: 7 days).
      IMPORT_INTERVAL_SECONDS: 604800
