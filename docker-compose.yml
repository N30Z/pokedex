services:
  pokedex:
    build: ./backend
    container_name: pokedex-backend
    restart: unless-stopped
    ports:
      - "1510:1510"
    volumes:
      - ./data:/data
      - ./backend/app:/backend
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/pokedex.db
      MEDIA_PATH: /data

  frontend:
    build: ./frontend
    container_name: pokedex-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: http://localhost:1510
    depends_on:
      - pokedex

  importer:
    build: ./importer
    container_name: pokedex-importer
    profiles:
      - import
    volumes:
      - ./data:/data
      - ./backend:/backend
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/pokedex.db
